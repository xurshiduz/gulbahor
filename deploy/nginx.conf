# /etc/nginx/sites-available/erp — install.sh shu namunadan yozadi. HTTPS qismini certbot o'zi qo'shadi.

map $http_upgrade $erp_connection {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  listen [::]:80;
  server_name __DOMAIN__;

  # Brauzerdagi dastur: `current` — hozir ishlayotgan nusxaga havola.
  root __BASE__/current/web/dist;
  index index.html;

  # Kirim yoki Excel'dan import minglab qatorli bo'lishi mumkin; tovar rasmi ham shu yerdan o'tadi.
  client_max_body_size 12m;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
  }

  # Jonli yangilanish va do'kon agentlari: uzoq turadigan aloqa.
  location /socket.io/ {
    proxy_pass http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $erp_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Nomi tarkibidan chiqqan fayllar: o'zgarmaydi, brauzer qayta so'ramaydi.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Manba xaritalari tashqariga berilmaydi.
  location ~ \.map$ {
    return 404;
  }

  # Qolgan har manzil — dasturning o'zi; sahifa har safar yangisi olinadi (yangilanishdan keyin eski qolmasin).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
